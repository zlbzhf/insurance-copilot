name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate Hermes skill repository
        run: python3 scripts/validate_repo.py
      - name: Check skill bundle packaging
        run: python3 scripts/package_skill.py --check
      - name: Run static eval fixtures
        run: python3 scripts/run_evals.py
      - name: Validate public AIA knowledge pack
        run: python3 scripts/validate_knowledge_pack.py knowledge/institutions/aia
      - name: Validate public institution pack template
        run: python3 scripts/validate_knowledge_pack.py knowledge/institutions/_template --template
      - name: Validate agent workspace template
        run: python3 scripts/validate_agent_workspace.py agent-workspace-template --template
