name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dev test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate Hermes skill repository
        run: python3 scripts/validate_repo.py
      - name: Check skill bundle packaging
        run: python3 scripts/package_skill.py --check
      - name: Run static eval fixtures
        run: python3 scripts/run_evals.py
      - name: Validate registered public institution knowledge packs
        run: python3 scripts/validate_all_knowledge_packs.py
      - name: Validate public institution pack template
        run: python3 scripts/validate_knowledge_pack.py knowledge/institutions/_template --template
      - name: Validate agent workspace template
        run: python3 scripts/validate_agent_workspace.py agent-workspace-template --template
      - name: Smoke test ingestion gateway
        run: python3 scripts/ingest_gateway.py --help
      - name: Test local file connectors
        run: python3 -m pytest tests/test_local_file_connectors.py -q
      - name: Test renewal watcher
        run: python3 -m pytest tests/test_renewal_watcher.py -q
      - name: Test renewal watcher cron wrapper
        run: python3 -m pytest tests/test_renewal_watcher_cron_wrapper.py -q
      - name: Test private workspace readiness gate
        run: python3 -m pytest tests/test_private_workspace_readiness.py -q
      - name: Test private dry-run deployment harness
        run: python3 -m pytest tests/test_private_dry_run.py -q

      - name: Test practical practitioner MVP surface
        run: python3 -m pytest tests/test_practitioner_mvp_surface.py -q
      - name: Test generic-first architecture safeguards
        run: python3 -m pytest tests/test_generic_first_architecture.py -q
